# Copy this file to /config/packages/wohnmobil_tours.yaml.
# The command paths intentionally reference Home Assistant's active /config runtime.

wohnmobil_tour_names: {}

command_line:
  - sensor:
      name: Wohnmobil Gesamtroute
      unique_id: wohnmobil_gesamtroute
      command: 'python3 /config/scripts/wohnmobil_route.py --config /config/wohnmobil_tours.private.json'
      command_timeout: 300
      scan_interval: 3600
      value_template: '{{ value_json.state }}'
      json_attributes:
        - position_count
        - tour_count
        - home_radius_km
        - return_confirm_hours
        - home_stay_radius_km
        - home_stay_count
        - map_matching_enabled
        - map_matching_provider
        - min_lat
        - max_lat
        - min_lon
        - max_lon
        - center_lat
        - center_lon
        - tours
        - tour_01_geojson
        - tour_02_geojson
        - tour_03_geojson
        - tour_04_geojson
        - tour_05_geojson
        - tour_06_geojson
        - tour_07_geojson
        - tour_08_geojson
        - tour_09_geojson
