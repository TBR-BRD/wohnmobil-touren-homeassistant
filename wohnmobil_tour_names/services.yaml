set_name:
  name: Set tour name
  description: Store or replace the display name of a tour.
  fields:
    tour:
      name: Tour number
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Name
      required: true
      selector:
        text:

delete_name:
  name: Delete tour name
  description: Remove a stored custom name and fall back to the default tour name.
  fields:
    tour:
      name: Tour number
      required: true
      selector:
        number:
          min: 1
          mode: box
